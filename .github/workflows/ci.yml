name: CI

on:
  pull_request:

# デプロイは Workers Builds が担当するため、この workflow は検証だけを行う。
# Cloudflare の認証情報を GitHub に置かずに済ませるための分担。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-node の cache: pnpm より先に pnpm を入れる必要がある。
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
